<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лента новостей</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
:root{
  --bg:#f3effb; --surface:#fff; --text:#1e1633; --muted:#7a6f94; --line:#e6def5;
  --p50:#f5f0ff; --p100:#ebe0ff; --p300:#b794f6; --p500:#8b5cf6; --p600:#7c3aed; --p700:#6d28d9; --p900:#3b1a78;
  --shadow:0 1px 3px rgba(60,26,120,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140f22; --surface:#1e1733; --text:#efe9fb; --muted:#9d90bd; --line:#32275300;
    --line:#322753; --p50:#2a1f47; --p100:#3a2a63; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#140f22; --surface:#1e1733; --text:#efe9fb; --muted:#9d90bd; --line:#322753;
  --p50:#2a1f47; --p100:#3a2a63; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Inter","Segoe UI",Roboto,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--p500);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding:0 12px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:12px 4px;background:var(--bg)}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em;color:var(--p600)}
.theme{width:36px;height:36px;border-radius:50%;background:var(--p100);color:var(--p700);font-size:16px}

.avatar{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:68px;text-align:center;font-size:12px}
.ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(var(--p300),var(--p600),var(--p900),var(--p300));display:grid;place-items:center}
.ring.seen{background:var(--line)}
.ring .avatar{width:100%;height:100%;border:3px solid var(--bg);font-size:20px}
.add .ring{background:var(--p100)}
.add .avatar{background:var(--p50)!important;color:var(--p600);font-size:28px;font-weight:400}
.story span{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:20;background:rgba(20,10,40,.92);display:grid;place-items:center;padding:16px}
.card-story{position:relative;width:min(380px,100%);height:min(640px,86vh);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  padding:28px;color:#fff;text-align:center;font-size:24px;font-weight:700}
.bars{position:absolute;top:12px;left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.bars i{display:block;height:100%;background:#fff;animation:fill 5s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.who{position:absolute;top:26px;left:16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.who .avatar{width:34px;height:34px;font-size:14px;background:rgba(255,255,255,.25)}
.close{position:absolute;top:22px;right:12px;font-size:26px;color:#fff;width:40px;height:40px}

/* posts */
.post{background:var(--surface);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.head{display:flex;align-items:center;gap:10px}
.head .avatar{width:42px;height:42px;font-size:16px}
.head b{display:block;line-height:1.2}
.head small{color:var(--muted)}
.text{margin:12px 0;white-space:pre-line}
.pic{height:180px;border-radius:14px;margin:0 0 12px;display:grid;place-items:center;font-size:44px;color:rgba(255,255,255,.9);font-weight:800}
.actions{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.act{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600;transition:background .15s}
.act:hover{background:var(--p50);color:var(--p600)}
.act.on{background:var(--p100);color:var(--p600)}
.act.share{margin-left:auto}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.comments{margin-top:10px;display:grid;gap:10px}
.c{display:flex;gap:8px}
.c .avatar{width:30px;height:30px;font-size:12px}
.bubble{background:var(--p50);border-radius:14px;padding:6px 12px}
.bubble b{font-size:13px;color:var(--p700);display:block}
.new{display:flex;gap:8px;margin-top:4px}
.new input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:9px 14px;font:inherit}
.new input:focus{outline:2px solid var(--p500);border-color:transparent}
.send{background:var(--p600);color:#fff;border-radius:999px;padding:0 16px;font-weight:600}
.send:hover{background:var(--p700)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--p700);color:#fff;
  padding:10px 18px;border-radius:999px;z-index:30;font-weight:600}
</style>
</head>
<body>
<div id="app" class="app">
  <header>
    <h1>Лента</h1>
    <button class="theme" @click="toggleTheme" aria-label="Сменить тему">{{ dark ? '☀' : '☾' }}</button>
  </header>

  <div class="stories">
    <div class="story add"><div class="ring"><div class="avatar">+</div></div><span>Моя история</span></div>
    <button class="story" v-for="(u,i) in users" :key="u.id" @click="openStory(i)">
      <div class="ring" :class="{seen:u.seen}"><div class="avatar" :style="{background:u.bg}">{{ u.name[0] }}</div></div>
      <span>{{ u.name }}</span>
    </button>
  </div>

  <article class="post" v-for="p in posts" :key="p.id" :id="'post-'+p.id">
    <div class="head">
      <div class="avatar" :style="{background:author(p).bg}">{{ author(p).name[0] }}</div>
      <div><b>{{ author(p).name }} {{ author(p).last }}</b><small>{{ p.time }}</small></div>
    </div>
    <p class="text">{{ p.text }}</p>
    <div v-if="p.pic" class="pic" :style="{background:p.pic}">{{ p.emoji }}</div>
    <div class="actions">
      <button class="act" :class="{on:p.liked}" @click="like(p)" :aria-pressed="p.liked">
        <span :class="{pop:p.liked}">{{ p.liked ? '♥' : '♡' }}</span>{{ p.likes }}
      </button>
      <button class="act" :class="{on:p.open}" @click="p.open=!p.open">💬 {{ p.comments.length }}</button>
      <button class="act share" @click="share(p)">↗ Поделиться</button>
    </div>
    <div v-if="p.open" class="comments">
      <div class="c" v-for="(c,i) in p.comments" :key="i">
        <div class="avatar" :style="{background:c.bg}">{{ c.name[0] }}</div>
        <div class="bubble"><b>{{ c.name }}</b>{{ c.text }}</div>
      </div>
      <div class="new">
        <input v-model="p.draft" placeholder="Напишите комментарий…" @keyup.enter="comment(p)">
        <button class="send" @click="comment(p)">Отправить</button>
      </div>
    </div>
  </article>

  <div class="viewer" v-if="story!==null" @click.self="closeStory">
    <div class="card-story" :style="{background:users[story].card}">
      <div class="bars"><i :key="story"></i></div>
      <div class="who"><div class="avatar">{{ users[story].name[0] }}</div>{{ users[story].name }}</div>
      <button class="close" @click="closeStory" aria-label="Закрыть">×</button>
      {{ users[story].story }}
    </div>
  </div>
  <div class="toast" v-if="toast">{{ toast }}</div>
</div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;
const g = (a,b)=>`linear-gradient(135deg,${a},${b})`;
createApp({
  setup(){
    const users = reactive([
      {id:1,name:'Анна',last:'Орлова',bg:g('#a78bfa','#6d28d9'),card:g('#8b5cf6','#3b1a78'),story:'Сегодня первый снег в городе ❄',seen:false},
      {id:2,name:'Максим',last:'Серов',bg:g('#c084fc','#7e22ce'),card:g('#a855f7','#4c1d95'),story:'Запустили новую версию приложения!',seen:false},
      {id:3,name:'Лиза',last:'Миронова',bg:g('#d8b4fe','#9333ea'),card:g('#c084fc','#581c87'),story:'Утренняя пробежка: 8 км',seen:false},
      {id:4,name:'Дмитрий',last:'Власов',bg:g('#8b5cf6','#4c1d95'),card:g('#7c3aed','#2e1065'),story:'Лучший кофе в этом районе ☕',seen:true},
      {id:5,name:'Катя',last:'Белова',bg:g('#e9d5ff','#a855f7'),card:g('#d8b4fe','#6b21a8'),story:'Собираем вещи в отпуск ✈',seen:false},
      {id:6,name:'Игорь',last:'Лебедев',bg:g('#a78bfa','#5b21b6'),card:g('#8b5cf6','#4c1d95'),story:'Новый плейлист для работы 🎧',seen:true},
    ]);
    const posts = reactive([
      {id:1,user:2,time:'10 минут назад',text:'Мы выпустили обновление! Теперь лента работает быстрее, а истории можно смотреть без звука.\nСпасибо всем, кто тестировал.',pic:g('#8b5cf6','#3b1a78'),emoji:'🚀',likes:128,liked:false,open:false,draft:'',
        comments:[]},
      {id:2,user:1,time:'1 час назад',text:'Утром выпал первый снег. Город стал тише, и это лучшее начало дня.',pic:g('#c4b5fd','#7c3aed'),emoji:'❄',likes:76,liked:true,open:false,draft:'',
        comments:[{name:'Лиза',bg:users[2].bg,text:'У нас пока дождь 😔'}]},
      {id:3,user:3,time:'3 часа назад',text:'Пробежала 8 км за 42 минуты — личный рекорд. Кто со мной в воскресенье?',pic:null,emoji:'',likes:54,liked:false,open:false,draft:'',comments:[]},
      {id:4,user:4,time:'вчера в 19:30',text:'Нашёл кофейню с лучшим флэт-уайтом в районе. Адрес пришлю в личку.',pic:g('#a855f7','#4c1d95'),emoji:'☕',likes:203,liked:false,open:false,draft:'',
        comments:[{name:'Катя',bg:users[4].bg,text:'Скинь адрес, пожалуйста!'}]},
    ]);
    const story = ref(null), toast = ref(''), dark = ref(false);
    let timer, tt;
    const author = p => users.find(u=>u.id===p.user);
    const like = p => { p.liked=!p.liked; p.likes += p.liked?1:-1; };
    const comment = p => {
      const t = p.draft.trim(); if(!t) return;
      p.comments.push({name:'Вы',bg:g('#7c3aed','#3b1a78'),text:t}); p.draft='';
    };
    const say = m => { toast.value=m; clearTimeout(tt); tt=setTimeout(()=>toast.value='',2000); };
    const share = async p => {
      const link = location.href.split('#')[0] + '#post-' + p.id;
      try{
        await navigator.clipboard.writeText(link);
        say('Ссылка скопирована');
      }catch(e){
        try{
          const t = document.createElement('textarea');
          t.value = link; t.style.position='fixed'; t.style.opacity='0';
          document.body.appendChild(t); t.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(t);
          say(ok ? 'Ссылка скопирована' : 'Не удалось скопировать');
        }catch(e2){ say('Не удалось скопировать'); }
      }
    };
    const openStory = i => {
      story.value=i; users[i].seen=true;
      clearTimeout(timer);
      timer=setTimeout(()=> i+1<users.length ? openStory(i+1) : closeStory(), 5000);
    };
    const closeStory = () => { clearTimeout(timer); story.value=null; };
    const toggleTheme = () => {
      dark.value=!dark.value;
      document.documentElement.dataset.theme = dark.value?'dark':'light';
    };
    onMounted(()=>{
      dark.value = matchMedia('(prefers-color-scheme: dark)').matches;
      const el = location.hash && document.querySelector(location.hash);
      if(el) el.scrollIntoView();
    });
    return {users,posts,story,toast,dark,author,like,comment,share,openStory,closeStory,toggleTheme};
  }
}).mount('#app');
</script>
</body>
</html>
